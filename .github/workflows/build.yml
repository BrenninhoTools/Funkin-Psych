name: Build

on:
  push:
    branches: [main, experimental]
    paths-ignore: ['**.md', 'docs/**', 'documents-mobile/**', 'art/**', '.vscode/**']
  pull_request:
    branches: [main, experimental]
    paths-ignore: ['**.md', 'docs/**', 'documents-mobile/**', 'art/**', '.vscode/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HAXE_VERSION: '4.3.7'
  CACHE_REV: 'v7'
  NDK_VERSION: '27.2.12479018'
  HXCPP_CACHE_MB: '2048'
  APT_PACKAGES: g++ pkg-config libx11-dev libxi-dev libxext-dev libxfixes-dev libxinerama-dev libxrandr-dev libxcursor-dev libxss-dev libxtst-dev libgl-dev libgl1-mesa-dev libegl-dev libgles-dev libasound2-dev libpulse-dev libpipewire-0.3-dev libspa-0.2-dev libwayland-bin libwayland-dev wayland-protocols libxkbcommon-dev libdecor-0-dev libdbus-1-dev libudev-dev libdrm-dev libgbm-dev

jobs:
  build:
    name: ${{ matrix.target }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
            host: linux
            artifact: androidBuild
          - target: linux
            os: ubuntu-latest
            host: linux
            artifact: linuxBuild
          - target: windows
            os: windows-2022
            host: windows
            artifact: windowsBuild
          - target: mac
            os: macos-15
            host: mac
            artifact: macBuild
          - target: ios
            os: macos-15
            host: mac
            artifact: iOSBuild
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Speed up Windows
        if: matrix.host == 'windows'
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:RUNNER_TOOL_CACHE -ErrorAction SilentlyContinue
          git config --global core.fscache true
          git config --global core.preloadindex true

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false

      - name: Java 17
        if: matrix.target == 'android'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android NDK
        if: matrix.target == 'android'
        id: ndk
        run: |
          set -euo pipefail
          NDK_DIR="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [ ! -d "$NDK_DIR" ]; then
            for CANDIDATE in $(ls -d "$ANDROID_HOME"/ndk/27.* 2>/dev/null | sort -rV); do
              if [ -x "$CANDIDATE/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" ]; then
                NDK_DIR="$CANDIDATE"
                break
              fi
            done
          fi
          CLANG="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          if [ ! -x "$CLANG" ]; then
            NDK_DIR="$ANDROID_HOME/ndk/$NDK_VERSION"
            CLANG="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            { yes || true; } | "$SDKMANAGER" --install "ndk;$NDK_VERSION" > /dev/null
          fi
          test -x "$CLANG"
          test -d "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/aarch64-linux-android"
          "$CLANG" --version | head -n 1
          echo "ndk-path=$NDK_DIR" >> "$GITHUB_OUTPUT"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Prepare environment
        run: |
          set -euo pipefail
          CACHE_DIR="${RUNNER_TEMP//\\//}/hxcpp_cache"
          mkdir -p "$CACHE_DIR"
          echo "HXCPP_COMPILE_CACHE=$CACHE_DIR" >> "$GITHUB_ENV"
          case '${{ matrix.target }}' in
            android) TOOLCHAIN="ndk-$(basename "${ANDROID_NDK_ROOT:-none}")" ;;
            windows)
              VSWHERE="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
              VS_PATH="$("$VSWHERE" -latest -products '*' -property installationPath 2>/dev/null | tr -d '\r' | sed 's|\\|/|g' || true)"
              TOOLCHAIN="msvc-$(tr -d '\r\n ' < "$VS_PATH/VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt" 2>/dev/null || echo unknown)"
              ;;
            mac|ios) TOOLCHAIN="xcode-$(xcodebuild -version | head -n 1 | awk '{print $2}')" ;;
            *) TOOLCHAIN="gcc-$(gcc -dumpfullversion 2>/dev/null || echo unknown)" ;;
          esac
          echo "Toolchain: $TOOLCHAIN"
          echo "TOOLCHAIN_ID=$TOOLCHAIN" >> "$GITHUB_ENV"
          LIME_REF="$(tr -d '\r\n\t ' < hmm.json | grep -o '"name":"lime"[^}]*' | grep -o '"ref":"[^"]*"' | cut -d'"' -f4)"
          echo "LIME_REF=${LIME_REF:-unknown}" >> "$GITHUB_ENV"
          echo "CACHE_STAMP=${RUNNER_TEMP//\\//}/cache.stamp" >> "$GITHUB_ENV"
          echo "HAXELIB_GLOBAL=$(haxelib config | tr -d '\r' | sed 's|\\|/|g; s|/$||')" >> "$GITHUB_ENV"
          case '${{ matrix.host }}' in
            linux) THREADS="$(nproc)" ;;
            mac) THREADS="$(sysctl -n hw.ncpu)" ;;
            windows) THREADS="$NUMBER_OF_PROCESSORS" ;;
          esac
          echo "HXCPP_COMPILE_THREADS=$THREADS" >> "$GITHUB_ENV"
          git config --global core.longpaths true
          git config --global advice.detachedHead false

      - name: Restore Haxe tools
        id: tools-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.HAXELIB_GLOBAL }}
          key: haxe-tools-${{ env.CACHE_REV }}-${{ runner.os }}-${{ env.HAXE_VERSION }}

      - name: Restore Haxelibs
        id: haxelib-cache
        uses: actions/cache/restore@v6
        with:
          path: .haxelib
          key: haxelib-${{ env.CACHE_REV }}-${{ matrix.target }}-${{ env.HAXE_VERSION }}-${{ hashFiles('hmm.json') }}-${{ github.run_id }}
          restore-keys: |
            haxelib-${{ env.CACHE_REV }}-${{ matrix.target }}-${{ env.HAXE_VERSION }}-${{ hashFiles('hmm.json') }}-

      - name: Restore hxcpp
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/hxcpp_cache
          key: hxcpp-${{ env.CACHE_REV }}-${{ matrix.target }}-${{ env.TOOLCHAIN_ID }}-${{ github.run_id }}
          restore-keys: |
            hxcpp-${{ env.CACHE_REV }}-${{ matrix.target }}-${{ env.TOOLCHAIN_ID }}-

      - name: Restore Gradle
        if: matrix.target == 'android'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ env.CACHE_REV }}-${{ github.run_id }}
          restore-keys: |
            gradle-${{ env.CACHE_REV }}-

      - name: Stamp caches
        run: |
          sleep 1
          touch "$CACHE_STAMP"

      - name: Configure Gradle mirrors
        if: matrix.target == 'android'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/mirrors.gradle" <<'GRADLE'
          def mirrors = [
              'https://maven-central.storage-download.googleapis.com/maven2/',
              'https://repo1.maven.org/maven2/',
              'https://maven.google.com/'
          ]
          beforeSettings { settings ->
              settings.pluginManagement.repositories {
                  mirrors.each { mirror -> maven { url = uri(mirror) } }
                  gradlePluginPortal()
              }
          }
          allprojects {
              buildscript {
                  repositories {
                      mirrors.each { mirror -> maven { url = uri(mirror) } }
                  }
              }
              repositories {
                  mirrors.each { mirror -> maven { url = uri(mirror) } }
              }
          }
          GRADLE
          {
            echo "org.gradle.caching=true"
            echo "org.gradle.parallel=true"
            echo "org.gradle.configureondemand=true"
            echo "org.gradle.vfs.watch=false"
            echo "org.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -Dfile.encoding=UTF-8"
            echo "org.gradle.workers.max=$(nproc)"
            echo "kotlin.incremental=true"
            echo "systemProp.org.gradle.internal.http.connectionTimeout=120000"
            echo "systemProp.org.gradle.internal.http.socketTimeout=120000"
            echo "systemProp.org.gradle.internal.repository.max.retries=5"
          } >> "$HOME/.gradle/gradle.properties"

      - name: Install Haxelibs
        id: install-haxelibs
        run: |
          set -euo pipefail
          if [ '${{ steps.tools-cache.outputs.cache-hit }}' != true ] || ! haxelib --global libpath hmm > /dev/null 2>&1; then
            haxelib fixrepo --global || true
            haxelib --never --global install haxelib 4.1.0
            haxelib --global set haxelib 4.1.0
            haxelib --global remove haxelib git || true
            haxelib --global remove hmm || true
            haxelib --never --global git haxelib https://github.com/FunkinCrew/haxelib.git funkin-patches --skip-dependencies
            haxelib --never --global git hmm https://github.com/FunkinCrew/hmm.git funkin-patches
          fi
          haxelib version
          NEED_INSTALL=0
          if [ -z '${{ steps.haxelib-cache.outputs.cache-matched-key }}' ]; then
            NEED_INSTALL=1
          else
            for LIB in hxcpp lime openfl flixel flixel-addons hscript polymod haxeui-core haxeui-flixel; do
              if ! haxelib libpath "$LIB" > /dev/null 2>&1; then
                echo "::warning::Cached haxelib $LIB is broken, reinstalling"
                NEED_INSTALL=1
                break
              fi
            done
          fi
          if [ "$NEED_INSTALL" = 1 ]; then
            haxelib --global run hmm install -q
          fi
          for LIB in hxcpp lime openfl flixel; do
            haxelib libpath "$LIB" > /dev/null
          done
          echo "installed=$NEED_INSTALL" >> "$GITHUB_OUTPUT"
          haxelib list | head -n 60

      - name: Restore Lime libraries
        uses: actions/cache/restore@v6
        with:
          path: .haxelib/lime/git/ndll
          key: lime-ndll-${{ env.CACHE_REV }}-${{ matrix.target }}-${{ env.TOOLCHAIN_ID }}-${{ env.LIME_REF }}-${{ github.run_id }}
          restore-keys: |
            lime-ndll-${{ env.CACHE_REV }}-${{ matrix.target }}-${{ env.TOOLCHAIN_ID }}-${{ env.LIME_REF }}-

      - name: Check Lime state
        id: lime-state
        run: |
          set -euo pipefail
          LIME="$(haxelib libpath lime | head -n 1 | tr -d '\r')"
          LIME="${LIME//\\//}"
          LIME="${LIME%/}"
          echo "LIME_DIR=$LIME" >> "$GITHUB_ENV"
          case '${{ matrix.host }}' in
            linux) HOST=linux; ARCH=-64 ;;
            windows) HOST=windows; ARCH=-64 ;;
            mac)
              HOST=mac
              if [ "$(uname -m)" = arm64 ]; then ARCH=-arm64; else ARCH=-64; fi
              ;;
          esac
          echo "LIME_HOST=$HOST" >> "$GITHUB_ENV"
          echo "LIME_ARCH=$ARCH" >> "$GITHUB_ENV"
          NEEDS_REBUILD=false
          [ -f "$LIME/ndll/.psych-host-$HOST$ARCH" ] || NEEDS_REBUILD=true
          case '${{ matrix.target }}' in
            android|ios) [ -f "$LIME/ndll/.psych-${{ matrix.target }}" ] || NEEDS_REBUILD=true ;;
          esac
          echo "rebuild=$NEEDS_REBUILD" >> "$GITHUB_OUTPUT"
          echo "Lime needs rebuild: $NEEDS_REBUILD"

      - name: Install Linux packages
        if: matrix.host == 'linux' && (matrix.target == 'linux' || steps.lime-state.outputs.rebuild == 'true')
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: ${{ env.APT_PACKAGES }} ${{ matrix.target == 'linux' && 'libvlc-dev libvlccore-dev' || '' }}
          version: ${{ env.CACHE_REV }}-${{ matrix.target }}

      - name: Fetch Lime submodules
        run: |
          set -euo pipefail
          LIME="$LIME_DIR"
          test -d "$LIME/.git"
          REQUIRED="project/Build.xml project/lib/cairo-files.xml project/lib/cairo/src/cairo.h project/lib/pixman/pixman/pixman.h project/lib/dr_libs/dr_flac.h project/lib/sdl/include project/lib/openal/include project/lib/freetype/include project/lib/harfbuzz/src"
          MISSING=0
          for FILE in $REQUIRED; do [ -e "$LIME/$FILE" ] || MISSING=1; done
          if [ "$MISSING" = 0 ]; then
            echo "Lime submodules already present"
            exit 0
          fi
          git -C "$LIME" submodule sync --recursive
          for TRY in 1 2 3; do
            if git -C "$LIME" submodule update --init --recursive --depth 1 --jobs 8; then
              break
            fi
            if [ "$TRY" = 3 ]; then
              exit 1
            fi
            sleep 10
          done
          git -C "$LIME" submodule status --recursive
          for FILE in project/Build.xml project/lib/cairo-files.xml project/lib/cairo/src/cairo.h project/lib/pixman/pixman/pixman.h project/lib/dr_libs/dr_flac.h project/lib/sdl/include project/lib/openal/include project/lib/freetype/include project/lib/harfbuzz/src; do
            if [ ! -e "$LIME/$FILE" ]; then
              echo "::error::Lime is missing $FILE"
              exit 1
            fi
          done

      - name: Patch Lime sources
        if: steps.lime-state.outputs.rebuild == 'true'
        run: |
          set -euo pipefail
          rm -rf "$LIME_DIR/project/obj"
          EAX="$LIME_DIR/project/lib/openal/al/eax/api.h"
          if [ -f "$EAX" ]; then
            perl -pi -e 's/gsl::narrow<(eax_u?long)>\(x\)/static_cast<$1>(x)/g' "$EAX"
            grep -n 'static_cast<eax' "$EAX" || true
          fi

      - name: Compile hxcpp tools
        run: |
          set -euo pipefail
          HXCPP="$(haxelib libpath hxcpp | head -n 1 | tr -d '\r')"
          HXCPP="${HXCPP//\\//}"
          HXCPP="${HXCPP%/}"
          if [ -f "$HXCPP/hxcpp.n" ] && [ -z "$(find "$HXCPP/tools/hxcpp" -name '*.hx' -newer "$HXCPP/hxcpp.n" -print -quit)" ]; then
            echo "hxcpp tools are up to date"
            exit 0
          fi
          cd "$HXCPP/tools/hxcpp"
          haxe compile.hxml

      - name: Build Lime host library
        run: |
          set -euo pipefail
          MARKER="$LIME_DIR/ndll/.psych-host-$LIME_HOST$LIME_ARCH"
          if [ ! -f "$MARKER" ]; then
            haxelib run lime rebuild "$LIME_HOST" "$LIME_ARCH" -release 2>&1 | tee lime-host.log
            touch "$MARKER"
          fi
          find "$LIME_DIR/ndll" \( -name 'lime.ndll' -o -name 'lime.hdll' \) -print

      - name: Configure Android
        if: matrix.target == 'android'
        env:
          NDK_PATH: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$NDK_PATH"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      - name: Build Lime target library
        if: matrix.target == 'android' || matrix.target == 'ios'
        run: |
          set -euo pipefail
          MARKER="$LIME_DIR/ndll/.psych-${{ matrix.target }}"
          if [ ! -f "$MARKER" ]; then
            if [ '${{ matrix.target }}' = android ]; then
              haxelib run lime rebuild android -arm64 -release 2>&1 | tee lime-target.log
            else
              haxelib run lime rebuild ios -release 2>&1 | tee lime-target.log
            fi
            touch "$MARKER"
          fi

      - name: Use bundled Lua
        if: matrix.target == 'android' || matrix.target == 'ios'
        run: |
          set -euo pipefail
          LUA="$(haxelib libpath linc_luajit | head -n 1 | tr -d '\r')"
          LUA="${LUA//\\//}"
          LUA="${LUA%/}/lib/lua/lib"
          case '${{ matrix.target }}' in
            android) DIRS=(Android) ;;
            ios) DIRS=(iPhone) ;;
          esac
          for DIR in "${DIRS[@]}"; do
            mkdir -p "$LUA/$DIR"
            find "$LUA/$DIR" -maxdepth 1 -name '*.a' -print | while read -r LIB; do
              printf '!<arch>\n' > "$LIB"
            done
          done
          if [ '${{ matrix.target }}' = ios ]; then
            printf '!<arch>\n' > "$LUA/iPhone/libluajit.iphoneos-64.a"
            printf '!<arch>\n' > "$LUA/iPhone/libluajit.iphonesim-64.a"
          fi

      - name: Compile
        if: matrix.target != 'ios'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          FLAGS=(-release -D officialBuild)
          if [ '${{ matrix.target }}' = android ] && [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            FLAGS+=(-D ANDROID_SIGNING)
          fi
          if [ '${{ matrix.target }}' = android ]; then
            export GRADLE_OPTS="-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
          fi
          haxelib run lime build '${{ matrix.target }}' "${FLAGS[@]}" 2>&1 | tee compile.log

      - name: Generate Xcode project
        if: matrix.target == 'ios'
        run: |
          set -euo pipefail
          haxelib run lime update ios -release -D officialBuild 2>&1 | tee compile.log
          test -n "$(find export/release/ios -maxdepth 1 -name '*.xcodeproj' -print -quit)"

      - name: Build iOS
        if: matrix.target == 'ios'
        run: |
          set -euo pipefail
          PROJECT="$(find export/release/ios -maxdepth 1 -name '*.xcodeproj' -print -quit)"
          xcodebuild -project "$PROJECT" -configuration Release -sdk iphoneos -arch arm64 -jobs "$HXCPP_COMPILE_THREADS" -quiet \
            -parallelizeTargets -skipPackagePluginValidation -skipMacroValidation \
            ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO DEBUG_INFORMATION_FORMAT=dwarf GCC_OPTIMIZATION_LEVEL=s \
            ENABLE_BITCODE=NO VALIDATE_PRODUCT=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build 2>&1 | tee xcode.log

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          case '${{ matrix.target }}' in
            android)
              find export/release/android/bin/app/build/outputs/apk -type f -name '*.apk' -exec cp {} dist/ \;
              ;;
            linux)
              tar -czf dist/PsychEngine-Linux.tar.gz -C export/release/linux/bin .
              ;;
            windows)
              cp -R export/release/windows/bin/. dist/
              ;;
            mac)
              APP="$(find export/release/macos/bin -maxdepth 1 -type d -name '*.app' -print -quit)"
              test -n "$APP"
              ditto -c -k --keepParent "$APP" dist/PsychEngine-macOS.zip
              ;;
            ios)
              APP="$(find export/release/ios -type d -name '*.app' -path '*iphoneos*' -print -quit)"
              test -n "$APP"
              mkdir -p ipa/Payload
              cp -R "$APP" ipa/Payload/
              (cd ipa && zip -qry ../dist/PsychEngine.ipa Payload)
              ;;
          esac
          test -n "$(ls -A dist)"
          ls -la dist

      - name: Detect cache changes
        if: always()
        id: changes
        run: |
          changed() { [ -d "$1" ] && [ -n "$(find "$1" -type f -newer "$CACHE_STAMP" -print -quit 2>/dev/null)" ] && echo true || echo false; }
          echo "hxcpp=$(changed "$HXCPP_COMPILE_CACHE")" >> "$GITHUB_OUTPUT"
          echo "ndll=$(changed "${LIME_DIR:-.haxelib/lime/git}/ndll")" >> "$GITHUB_OUTPUT"
          echo "gradle=$(changed "$HOME/.gradle/caches/modules-2/files-2.1")" >> "$GITHUB_OUTPUT"
          if [ -d "$HXCPP_COMPILE_CACHE" ]; then du -sh "$HXCPP_COMPILE_CACHE" || true; fi

      - name: Save Haxelibs
        if: always() && steps.install-haxelibs.outcome == 'success' && steps.install-haxelibs.outputs.installed == '1'
        uses: actions/cache/save@v6
        with:
          path: .haxelib
          key: haxelib-${{ env.CACHE_REV }}-${{ matrix.target }}-${{ env.HAXE_VERSION }}-${{ hashFiles('hmm.json') }}-${{ github.run_id }}

      - name: Save Lime libraries
        if: always() && steps.changes.outputs.ndll == 'true'
        uses: actions/cache/save@v6
        with:
          path: .haxelib/lime/git/ndll
          key: lime-ndll-${{ env.CACHE_REV }}-${{ matrix.target }}-${{ env.TOOLCHAIN_ID }}-${{ env.LIME_REF }}-${{ github.run_id }}

      - name: Save hxcpp
        if: always() && steps.changes.outputs.hxcpp == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/hxcpp_cache
          key: hxcpp-${{ env.CACHE_REV }}-${{ matrix.target }}-${{ env.TOOLCHAIN_ID }}-${{ github.run_id }}

      - name: Save Gradle
        if: always() && matrix.target == 'android' && steps.changes.outputs.gradle == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ env.CACHE_REV }}-${{ github.run_id }}

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          compression-level: ${{ matrix.target == 'windows' && 1 || 0 }}

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.target }}
          path: |
            lime-host.log
            lime-target.log
            compile.log
            xcode.log
          if-no-files-found: ignore
