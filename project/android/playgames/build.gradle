apply plugin: 'com.android.library'

repositories
{
	mavenCentral()
	google()
}

def readAppId()
{
	def value = System.getenv('PLAY_GAMES_APP_ID')
	if (value == null || value.trim().isEmpty()) value = project.findProperty('PLAY_GAMES_APP_ID')
	if (value == null || value.toString().trim().isEmpty())
	{
		def file = new File(projectDir, 'app_id.txt')
		value = file.exists() ? file.text : ''
	}
	value = value.toString().trim()
	return value.matches('\\d+') ? value : '0'
}

android
{
	namespace 'org.psychengine.playgames'
	compileSdkVersion Integer.parseInt(project.ANDROID_BUILD_SDK_VERSION)
	buildToolsVersion project.ANDROID_BUILD_TOOLS_VERSION

	buildFeatures
	{
		resValues true
	}

	defaultConfig
	{
		resValue 'string', 'psych_play_games_app_id', readAppId()
	}
}

dependencies
{
	implementation project(':deps:extension-api')
	implementation 'com.google.android.gms:play-services-games-v2:22.1.0'
}
